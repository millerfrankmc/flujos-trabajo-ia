[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flujos-trabajo-ia"
version = "0.1.0"
description = "Flujos de trabajo asistidos por IA con revisión humana y pruebas offline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Frank Miller", email = "fmiller@cygnus.com.pe"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
flujos-ia = "flujos_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
